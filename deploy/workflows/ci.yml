name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-sqlite:
    name: Backend Tests (SQLite + Chroma Dev Parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest (SQLite)
        env:
          DATABASE_URL: sqlite:///./data/test.db
          VECTOR_BACKEND: chroma
          STORAGE_BACKEND: local
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          ENVIRONMENT: development
        run: |
          cd backend
          pytest -v

  backend-postgres-pgvector:
    name: Backend Tests (PostgreSQL + pgvector Prod Parity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: studymate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/studymate_test
          MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/studymate_test
        run: |
          cd backend
          alembic upgrade head

      - name: Test Migration Roundtrip
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/studymate_test
        run: |
          cd backend
          alembic downgrade base
          alembic upgrade head

      - name: Run Backend Pytest (pgvector + db storage)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/studymate_test
          VECTOR_BACKEND: pgvector
          STORAGE_BACKEND: db
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          ENVIRONMENT: production
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
