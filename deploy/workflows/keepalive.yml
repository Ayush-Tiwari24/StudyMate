name: Backend Health Keepalive

on:
  # Cron disabled by default to allow Neon serverless compute to sleep when idle.
  # Enable if using Render free-tier without sleeping database constraints.
  # schedule:
  #   - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        env:
          SERVICE_URL: ${{ secrets.BACKEND_SERVICE_URL }}
        run: |
          if [ -n "$SERVICE_URL" ]; then
            echo "Pinging health endpoint: ${SERVICE_URL}/api/health/ready"
            curl -fsS -m 30 "${SERVICE_URL}/api/health/ready" || echo "Ping failed or timed out"
          else
            echo "BACKEND_SERVICE_URL secret not set. Skipping ping."
          fi
