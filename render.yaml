# ─────────────────────────────────────────────────────────────────
# Render Blueprint — StudyMate AI Backend Web Service
# ─────────────────────────────────────────────────────────────────
# Architecture: Unified Neon Serverless Postgres + Render Web Service
# Plan: Standard (2 GB RAM, 1 CPU) to safely accommodate PyTorch & embeddings
# Region: Singapore (ap-southeast-1 Neon + Singapore Render)
# ─────────────────────────────────────────────────────────────────

services:
  - type: web
    name: studymate-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: singapore
    healthCheckPath: /api/health/ready
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "StudyMate RAG"
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "2"
      - key: PREWARM_MODEL
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"

      # Unified data store: Neon Postgres for relational data, pgvector for vectors, db for PDF files
      - key: VECTOR_BACKEND
        value: pgvector
      - key: STORAGE_BACKEND
        value: db

      # Storage Limits
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: USER_STORAGE_QUOTA_MB
        value: "100"
      - key: GLOBAL_STORAGE_CAP_MB
        value: "400"

      # LLM Provider: Production Groq configuration
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      # Security: Auto-generate strong cryptographic JWT Secret
      - key: JWT_SECRET
        generateCrypto: true

      # Secrets & Environment Specific (configured via Render dashboard or env group)
      # DATABASE_URL: Neon pooled connection string (with -pooler) for app runtime
      - key: DATABASE_URL
        sync: false
      # MIGRATION_DATABASE_URL: Neon direct connection string (port 5432, non-pooler) for Alembic migrations
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
