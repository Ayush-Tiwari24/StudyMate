# ─────────────────────────────────────────────────────────────────
# Render Blueprint — StudyMate AI Backend Web Service
# ─────────────────────────────────────────────────────────────────
# Plan: Standard (2 GB RAM, 1 CPU) to safely accommodate PyTorch & embeddings
# Region: Singapore (closest Render region to Supabase Mumbai ap-south-1)
# ─────────────────────────────────────────────────────────────────

services:
  - type: web
    name: studymate-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: singapore
    healthCheckPath: /api/health/ready
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "StudyMate RAG"
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "2"
      - key: PREWARM_MODEL
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"

      # Dual backend selection: Online production uses pgvector + Supabase S3
      - key: VECTOR_BACKEND
        value: pgvector
      - key: STORAGE_BACKEND
        value: s3

      # LLM Provider: Production Groq configuration
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      # S3 Region (Supabase Mumbai)
      - key: S3_REGION
        value: ap-south-1

      # Security: Auto-generate strong cryptographic JWT Secret
      - key: JWT_SECRET
        generateCrypto: true

      # Secrets & Environment Specific (configured via Render dashboard or env group)
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
