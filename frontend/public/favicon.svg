<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96248" />
      <stop offset="100%" stop-color="#A53822" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD" />
      <stop offset="100%" stop-color="#F5B938" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Badge / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Open Academic Book Icon -->
  <g filter="url(#subtleShadow)">
    <!-- Left Page -->
    <path
      d="M13 22 C 19 19, 27 20, 31 23 L 31 46 C 26 43, 19 43, 13 45.5 Z"
      fill="url(#paperGrad)"
    />
    <!-- Left Page Text Line Accents -->
    <path
      d="M17 26.5 C 21 25, 25 25.5, 28 27 M17 31.5 C 21 30, 25 30.5, 28 32 M17 36.5 C 21 35, 25 35.5, 28 37"
      stroke="#C8553D"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-opacity="0.55"
    />

    <!-- Right Page -->
    <path
      d="M51 22 C 45 19, 37 20, 33 23 L 33 46 C 38 43, 45 43, 51 45.5 Z"
      fill="url(#paperGrad)"
    />
    <!-- Right Page Text Line Accents -->
    <path
      d="M36 27 C 39 25.5, 43 25, 47 26.5 M36 32 C 39 30.5, 43 30, 47 31.5 M36 37 C 39 35.5, 43 35, 47 36.5"
      stroke="#6B6B70"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-opacity="0.45"
    />

    <!-- Book Spine Fold -->
    <path
      d="M31 23 C 32 22.5, 32 22.5, 33 23 L 33 46 C 32 45.5, 32 45.5, 31 46 Z"
      fill="#D7CFBF"
    />
  </g>

  <!-- Golden Citation Ribbon / Bookmark -->
  <path
    d="M29.5 16 L34.5 16 L34.5 30 L32 27.5 L29.5 30 Z"
    fill="url(#goldGrad)"
    stroke="#D97706"
    stroke-width="0.5"
  />

  <!-- Academic Star / Knowledge Spark at Top Right -->
  <path
    d="M48 11.5 L49 13.5 L51 14.5 L49 15.5 L48 17.5 L47 15.5 L45 14.5 L47 13.5 Z"
    fill="url(#goldGrad)"
  />
</svg>