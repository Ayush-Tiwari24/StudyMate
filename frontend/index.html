<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyMate AI — A reading desk for your study notes. Ask questions, get answers with page-level citations." />

        document.documentElement.setAttribute('data-theme', savedTheme);
